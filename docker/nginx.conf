worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 250m;
    sendfile on;
    keepalive_timeout 65;

    log_format upstream '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr time=$request_time';
    access_log /var/log/nginx/access.log upstream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 80;

        set $api_upstream http://api:8000;
        set $trainer_upstream http://trainer:8001;
        set $ui_upstream http://ui:8501;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~ ^/(predict|health|uptime|model-info|docs|redoc|openapi\.json)$ {
            proxy_pass $api_upstream;
            proxy_read_timeout 60s;
        }

        location /trainer/ {
            rewrite ^/trainer/(.*)$ /$1 break;
            proxy_pass $trainer_upstream;
            proxy_request_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location / {
            proxy_pass $ui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }
    }
}
